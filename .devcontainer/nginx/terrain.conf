proxy_cache_path /var/cache/nginx/terrain keys_zone=terrain_cache:10m max_size=10g inactive=365d use_temp_path=off;
proxy_cache_path /var/cache/nginx/qgis keys_zone=qgis_cache:20m max_size=10g inactive=7d use_temp_path=off;
proxy_cache_path /var/cache/nginx/tiles keys_zone=tiles_cache:20m max_size=10g inactive=365d use_temp_path=off;

upstream ctod_backend {
    server ctod:5000;
    keepalive 64;
}

upstream qgis_backend {
    server qgis-server:80;
    keepalive 64;
}

# Backend app container — tile requests (WMTS/TMS/XYZ) are proxied here on cache miss
upstream mappa_backend {
    server app:33102;
    keepalive 32;
}

# Upstream with keepalive for better performance
server {
    listen 8091 default_server;
    server_name _;

    # Disable gzip compression in Nginx.
    # CTOD handles compression; Nginx double-zipping causes binary corruption.
    gzip off;

    # Define terrain as octet-stream for compatibility
    types {
        application/octet-stream terrain;
    }

    # Increase keepalive for clients
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Optimize buffers for binary terrain tiles
    proxy_buffers 64 16k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 128k;

    # Define resolver for dynamic upstreams
    resolver 127.0.0.11 valid=10s ipv6=off;

    # -------------------------------------------------------------------------
    # WMTS / TMS / XYZ Tile Caching
    # Frontend sends tile requests here directly (port 8091).
    # Cache HIT  → Nginx serves from disk, backend is bypassed entirely.
    # Cache MISS → Nginx proxies to mappa_backend (app:33102), caches response.
    # GetCapabilities / DescribeFeatureType / GetStyles are NOT cached because
    # they change frequently (layer availability, styles, etc.).
    # -------------------------------------------------------------------------
    location ~* ^/Admin/ {
        # Security: only allow requests from the internal Docker/loopback network
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://mappa_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Required for keepalive
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # Timeouts
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;

        # Resilience
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # Tile Caching
        proxy_cache tiles_cache;
        # Full request URI (path + all query params) is the cache key.
        # This ensures each unique tile (tilematrix, tilerow, tilecol, layer, format) is cached separately.
        proxy_cache_key "$request_uri";
        proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        proxy_cache_revalidate on;
        proxy_cache_min_uses 1;

        # Cache tile responses for 1 year — tiles are immutable by coordinates
        proxy_cache_valid 200 304 365d;
        # Do not cache errors
        proxy_cache_valid 404 1m;
        proxy_cache_valid 499 500 502 503 504 0s;

        # Bypass cache for metadata requests that change frequently
        set $bypass_tile_cache 0;
        if ($arg_request ~* "^(GetCapabilities|DescribeFeatureType|GetStyles)$") {
            set $bypass_tile_cache 1;
        }
        if ($arg_nocache = "1") {
            set $bypass_tile_cache 1;
        }
        if ($uri ~* "layer\.json$") {
            set $bypass_tile_cache 1;
        }
        proxy_cache_bypass $bypass_tile_cache;
        # proxy_no_cache is completely removed so bypassed requests still get saved to cache for offline use

        # Intercept upstream connection errors and redirect to offline fallback to serve from cache
        proxy_intercept_errors on;
        error_page 502 504 = @admin_offline_fallback;

        set $client_cache_control "public, max-age=14400, stale-while-revalidate=300";
        if ($bypass_tile_cache = "1") {
            set $client_cache_control "public, max-age=1, stale-while-revalidate=86400";
        }
        # Hide backend cache headers to prevent conflicting duplicates in the browser
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        
        add_header Cache-Control $client_cache_control;
        add_header X-Proxy-Cache $upstream_cache_status;

        # CORS Headers
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # -------------------------------------------------------------------------
    # Internal Tile Direct Proxy + Caching
    # Used for INTERNAL connections where the frontend communicates directly with
    # the source tile server (e.g., ogc.kabart.com.tr) WITHOUT going through the
    # backend gateway. Nginx caches the response so subsequent requests are served
    # from disk with zero backend or external network involvement.
    #
    # URL format: /tile-proxy/{source-host}/{path}?{query}
    # Example:    /tile-proxy/ogc.kabart.com.tr/gwc/service/wmts?service=WMTS&...
    # Nginx fetches: https://ogc.kabart.com.tr/gwc/service/wmts?service=WMTS&...
    #
    # Security: restricted to internal Docker / loopback addresses only.
    # -------------------------------------------------------------------------
    location ~* ^/tile-proxy/([^/?]+)(/.+)$ {
        # Security: only allow requests from the internal Docker/loopback network
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        # Extract target host ($1) and path ($2) from URL
        set $tile_proxy_host $1;
        set $tile_proxy_path $2;

        # External DNS resolver — needed for dynamic host resolution
        # 8.8.8.8 for internet hosts; 127.0.0.11 for Docker internal hosts
        resolver 8.8.8.8 1.1.1.1 127.0.0.11 valid=30s ipv6=off;

        # Proxy directly to the source tile server (no backend gateway involved)
        proxy_pass https://$tile_proxy_host$tile_proxy_path$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $tile_proxy_host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSL: enable SNI so external servers can handle certificate routing
        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        # Timeouts for external tile sources
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;

        # Tile Caching — same zone and policy as /Admin/ external tiles
        proxy_cache tiles_cache;
        # Cache key: target host + full path + query (unique per tile coordinate)
        proxy_cache_key "$tile_proxy_host$tile_proxy_path$is_args$args";
        proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        proxy_cache_revalidate on;
        proxy_cache_min_uses 1;

        # Cache tiles for 1 year — immutable by tile coordinates
        proxy_cache_valid 200 304 365d;
        proxy_cache_valid 404 1m;
        proxy_cache_valid 499 500 502 503 504 0s;

        # Bypass cache for metadata requests that change frequently
        set $bypass_direct_tile_cache 0;
        if ($arg_request ~* "^(GetCapabilities|DescribeFeatureType|GetStyles)$") {
            set $bypass_direct_tile_cache 1;
        }
        if ($arg_nocache = "1") {
            set $bypass_direct_tile_cache 1;
        }
        if ($uri ~* "layer\.json$") {
            set $bypass_direct_tile_cache 1;
        }
        proxy_cache_bypass $bypass_direct_tile_cache;
        # proxy_no_cache is completely removed so bypassed requests still get saved to cache for offline use

        # Intercept upstream connection errors and redirect to offline fallback to serve from cache
        proxy_intercept_errors on;
        error_page 502 504 = @direct_offline_fallback;

        set $client_cache_control "public, max-age=14400, stale-while-revalidate=300";
        if ($bypass_direct_tile_cache = "1") {
            set $client_cache_control "public, max-age=1, stale-while-revalidate=86400";
        }
        # Hide backend cache headers to prevent conflicting duplicates in the browser
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        
        add_header Cache-Control $client_cache_control;
        add_header X-Proxy-Cache $upstream_cache_status;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }


    location /terrain/tanzania/layer.json {
        alias /usr/share/nginx/html/tanzania_layer.json;
        add_header Access-Control-Allow-Origin *;
        add_header Content-Type application/json;
    }

    # Regex location for Tanzania tiles to strip query params without using 'if'
    # This avoids Nginx instability under high concurrency
    location ~* ^/terrain/(tanzania/.*\.terrain) {
        rewrite ^/terrain/(.*) /tiles/$1? break;
        proxy_pass http://ctod_backend;
        
        # Optimized Proxy & Cache Settings
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Required for keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding $http_accept_encoding;

        # Increase timeouts for terrain generation
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        # Resilience: Retry on backend failure
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # Enable disk caching
        proxy_cache terrain_cache;
        proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        
        # Cache Key: Ignore query parameters for better hit rate
        proxy_cache_key "$host$uri";
        
        # Cache Lock: Crucial for high-concurrency requests
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        proxy_cache_revalidate on;
        proxy_cache_min_uses 1;
        
        # Cache successful responses for a year
        proxy_cache_valid 200 304 365d;
        
        # DO NOT cache errors
        proxy_cache_valid 404 1m;
        proxy_cache_valid 499 500 502 503 504 0s;
        
        # Cache control headers sent to the browser
        expires 4h;
        add_header Cache-Control "public, max-age=14400, stale-while-revalidate=300";
        add_header X-Proxy-Cache $upstream_cache_status;
        
        # Ensure CORS is allowed
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # General terrain location
    location /terrain/ {
        rewrite ^/terrain/(.*) /tiles/$1 break;
        proxy_pass http://ctod_backend;
        
        # Optimized Proxy & Cache Settings
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Required for keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding $http_accept_encoding;

        # Increase timeouts for terrain generation
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        # Resilience: Retry on backend failure
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # Enable disk caching
        proxy_cache terrain_cache;
        proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        
        # Cache Key: Ignore query parameters for better hit rate
        proxy_cache_key "$host$uri";

        # Cache Lock
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        proxy_cache_revalidate on;
        proxy_cache_min_uses 1;
        
        # Cache successful responses for a year
        proxy_cache_valid 200 304 365d;
        
        # DO NOT cache errors
        proxy_cache_valid 404 1m;
        proxy_cache_valid 499 500 502 503 504 0s;
        
        # Cache control headers sent to the browser
        expires 4h;
        add_header Cache-Control "public, max-age=14400, stale-while-revalidate=300";
        add_header X-Proxy-Cache $upstream_cache_status;
        
        # Ensure CORS is allowed
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # QGIS Server proxy and caching configuration
    location ~* ^/(ows|qgis)/? {
        # Force a trailing slash so that the internal Nginx in the qgis-server container doesn't return 404
        rewrite ^/ows$ /ows/ break;
        rewrite ^/qgis$ /qgis/ break;

        proxy_pass http://qgis_backend;
        
        # Optimized Proxy Settings
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Required for keepalive
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8091;

        # Dynamic response rewriting to inject port 8091 into GetCapabilities OnlineResource URLs
        sub_filter 'http://$host/ows/' 'http://$http_host/ows/';
        sub_filter_once off;
        sub_filter_types application/xml text/xml application/vnd.ogc.wms_xml application/vnd.ogc.wfs_xml;

        # Timeouts for heavy map rendering tasks
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        # Resilience: Retry on backend failure
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # Enable disk caching for QGIS
        proxy_cache qgis_cache;
        proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires;
        
        # Bypass cache for capabilities/schema metadata or if explicit nocache=1 is requested
        set $bypass_qgis_cache 0;
        if ($arg_request ~* "^(GetCapabilities|DescribeFeatureType)$") {
            set $bypass_qgis_cache 1;
        }
        if ($arg_nocache = "1") {
            set $bypass_qgis_cache 1;
        }
        proxy_cache_bypass $bypass_qgis_cache;
        proxy_no_cache $bypass_qgis_cache;

        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        
        # Cache Key: Captures full URL + query arguments (since maps depend on query args)
        proxy_cache_key "$host$request_uri";
        
        # Cache Lock: Crucial for high-concurrency requests to prevent backend thundering herd
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        proxy_cache_revalidate on;
        proxy_cache_min_uses 1;
        
        # Cache successful responses (HTTP 200, 304) for 7 days
        proxy_cache_valid 200 304 7d;
        
        # Cache errors for very short duration
        proxy_cache_valid 404 1m;
        proxy_cache_valid 499 500 502 503 504 0s;
        
        # Cache control headers sent to the browser
        expires 4h;
        add_header Cache-Control "public, max-age=14400, stale-while-revalidate=300";
        add_header X-Proxy-Cache $upstream_cache_status;
        
        # CORS Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # -------------------------------------------------------------------------
    # Offline Fallback Locations
    # When cache is bypassed but the upstream server is offline, Nginx intercepts 
    # the 502/504 errors and redirects to these locations to force a read from cache.
    # -------------------------------------------------------------------------
    location @admin_offline_fallback {
        proxy_pass http://mappa_backend;
        
        proxy_cache tiles_cache;
        proxy_cache_key "$request_uri";
        # Do not bypass cache here! Nginx will first read the cache.
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        
        add_header X-Proxy-Cache "OFFLINE_FALLBACK" always;
        add_header Access-Control-Allow-Origin * always;
    }

    location @direct_offline_fallback {
        set $fallback_host "";
        set $fallback_path "";
        if ($uri ~* ^/tile-proxy/([^/?]+)(/.+)$) {
            set $fallback_host $1;
            set $fallback_path $2;
        }

        resolver 8.8.8.8 1.1.1.1 127.0.0.11 valid=30s ipv6=off;
        proxy_pass https://$fallback_host$fallback_path$is_args$args;
        
        proxy_cache tiles_cache;
        proxy_cache_key "$fallback_host$fallback_path$is_args$args";
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        
        add_header X-Proxy-Cache "OFFLINE_FALLBACK" always;
        add_header Access-Control-Allow-Origin * always;
    }

    location /static_meta/ {
        # Path where layer_meta.json will be mounted
        alias /usr/share/nginx/html/;
    }

    location / {
        return 200 "Nginx is alive at port 8081\n";
    }
}

