db:
  url: "postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}/${DB_NAME}"
oidc:
  jwks_uri: "http://sso-api/api/sso/oidc/jwks"
elk:
  host: "logstash"
  port: 5000
apm:
  service_name: "mapa-messaging"
  secret_token: ""
  server_url: "http://apm-server:8200"
  environment: "mapa-messaging-service-environment"
  body: "all"
  log_level: "info"
  sanitize_field_names: "password,passwd,pwd,secret,*key,*token*,*session*,*credit*,*card*,*auth*,*principal*,set-cookie,tckno,tcno,vergi,tc,adres,iban,*logo*,*client_id*,*clientid*,*client-id*,*clientId*"
alembic:
  url: "postgresql://${MIG_USER}:${MIG_PASSWORD}@${DB_HOST}/${DB_NAME}"
rabbitmq:
  exchange_name: ${RABBIT_EXCHANGE_NAME}
  host: ${RABBIT_HOST}
  port: ${RABBIT_PORT}
  username: ${RABBIT_USERNAME}
  password: ${RABBIT_PASSWORD}
  virtual_host: ${RABBIT_V_HOST}
mqtt:
  host: "emqx"
  port: 1883
  wss_port: 8084
  username: "mapa"
  password: "mapa"
redis:
  host: ${REDIS_HOST}
  port: ${REDIS_WRITE_PORT}
  password: ${REDIS_PASSWORD}
  db: ${REDIS_DB}
minio:
  endpoint: "${MINIO_ENDPOINT}"
  external_endpoint: "${MINIO_EXTERNAL_ENDPOINT}"
  access_key: "${MINIO_ACCESS_KEY}"
  secret_key: "${MINIO_SECRET_KEY}"
  bucket: "mapa-message-files"
  secure: false
